    if (!p) { say('Could not read that path. Try $.users[0].name'); return; }
    var v = data; for (var i = 0; i < p.length; i++) { if (v === null || typeof v !== 'object' || !(p[i] in v)) { say('Nothing at ' + pstr(p.slice(0, i + 1))); return; } v = v[p[i]]; }
    reveal(p); paint(); var idx = rows.findIndex(function (r) { return !r.more && pkey(r.p) === pkey(p); }); if (idx >= 0) { cur = idx; paint(); focusRow(); say('Went to ' + pstr(p)); }
  }

  /* ---------- toolbar ---------- */
  function say(t) { var s = $('status'); if (valid) { s.className = 'status'; s.textContent = t; } }
  function copy(text, ok) {
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { say(ok || 'Copied'); }, function () { window.prompt('Copy this', text); });
  }
  function sortDeep(v) { if (Array.isArray(v)) return v.map(sortDeep); if (v && typeof v === 'object') { var o = {}; Object.keys(v).sort().forEach(function (k) { o[k] = sortDeep(v[k]); }); return o; } return v; }
  var timer;
  function flush() { if (timer) { clearTimeout(timer); timer = null; parseNow(); } }   // parse what was just typed before acting on it
  function setText(t) { clearTimeout(timer); timer = null; $('src').value = t; parseNow(); }
  $('sample').addEventListener('click', function () { setText(JSON.stringify(SAMPLE, null, 2)); });
  $('fmt').addEventListener('click', function () { flush(); if (valid) setText(JSON.stringify(data, null, 2)); });
  $('min').addEventListener('click', function () { flush(); if (valid) setText(JSON.stringify(data)); });
  $('sort').addEventListener('click', function () { flush(); if (valid) setText(JSON.stringify(sortDeep(data), null, 2)); });
  $('copy').addEventListener('click', function () { if ($('src').value) copy($('src').value, 'Input copied'); });
  $('clear').addEventListener('click', function () { setText(''); $('q').value = ''; $('src').focus(); });
  $('expand').addEventListener('click', function () {
    if (!valid) return; var n = 0; (function walk(v, p, d) { var k = kind(v); if ((k === 'object' || k === 'array') && n < 2000) { n++; expanded[pkey(p)] = true; kids(v).forEach(function (c) { walk(c[1], p.concat([c[0]]), d + 1); }); } })(data, [], 0);
    paint(); say(n >= 2000 ? 'Expanded the first 2000 containers; the rest stay closed to keep the page fast.' : 'Expanded everything.');
  });
  $('collapse').addEventListener('click', function () { expanded = { '[]': true }; cur = 0; paint(); });
  $('cpath').addEventListener('click', function () { if (rows[cur]) copy(pstr(rows[cur].p), 'Path copied'); });
  $('cval').addEventListener('click', function () { if (rows[cur] && !rows[cur].more) copy(JSON.stringify(rows[cur].v, null, 2), 'Value copied'); });
  $('paste').addEventListener('click', function () {
    if (!navigator.clipboard || !navigator.clipboard.readText) { $('src').focus(); say('Your browser blocks reading the clipboard here: click the box and press Ctrl/Cmd+V.'); return; }
    navigator.clipboard.readText().then(setText, function () { $('src').focus(); say('Clipboard access was blocked: click the box and press Ctrl/Cmd+V.'); });
  });
  function readFile(f) { if (!f) return; if (f.size > 20e6) { say('That file is over 20 MB: too large for this page.'); return; } f.text().then(setText); }
  $('file').addEventListener('change', function () { readFile(this.files[0]); this.value = ''; });
  var box = $('src');
  ['dragenter', 'dragover'].forEach(function (n) { box.addEventListener(n, function (e) { e.preventDefault(); box.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (n) { box.addEventListener(n, function () { box.classList.remove('drag'); }); });
  box.addEventListener('drop', function (e) { e.preventDefault(); readFile(e.dataTransfer.files[0]); });
  box.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { timer = null; parseNow(); }, 200); });
  setText(JSON.stringify(SAMPLE, null, 2));   // open on an example so the tree is visible straight away; Clear empties it
})();
</script>
</body>
</html>
