<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro timer</title>
<script type="application/json" id="shelf-meta">
{
  "title": "Pomodoro timer",
  "description": "A focus timer with 25/5/15 minute modes and a soft end-of-session chime.",
  "created": "2026-10-20",
  "tool": "Claude",
  "kind": "app",
  "install": true,
  "color": "#d64933",
  "icon": "icon.png",
  "tags": ["timer", "productivity", "sample"],
  "notes": "Sample artifact. Keeps nothing; refresh resets the timer. I would add a session counter."
}
</script>
<style>
  :root { color-scheme: light dark; --bg:#f6f5f1; --fg:#1d1d1b; --muted:#6b6a64; --accent:#d64933; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141413; --fg:#f1efe8; --muted:#9a988e; --accent:#ff6b52; --card:#1e1e1c; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  main { width:100%; max-width:380px; background:var(--card); border-radius:20px; padding:28px 24px; text-align:center;
         box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size:1rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 20px; font-weight:600; }
  .modes { display:flex; gap:8px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
  .modes button { border:1px solid var(--muted); background:transparent; color:var(--fg); border-radius:999px; padding:8px 14px; font:inherit; cursor:pointer; }
  .modes button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .ring { position:relative; width:220px; height:220px; margin:0 auto 24px; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:10; }
  .track { stroke:color-mix(in srgb, var(--muted) 25%, transparent); }
  .bar { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .5s linear; }
  .time { position:absolute; inset:0; display:grid; place-items:center; font-size:3rem; font-variant-numeric:tabular-nums; font-weight:600; }
  .actions { display:flex; gap:10px; justify-content:center; }
  .actions button { min-width:110px; padding:12px 18px; border-radius:12px; border:0; font:inherit; font-weight:600; cursor:pointer; }
  #toggle { background:var(--accent); color:#fff; }
  #reset { background:transparent; color:var(--fg); border:1px solid var(--muted); }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Pomodoro</h1>
  <div class="modes" role="group" aria-label="Mode">
    <button type="button" data-min="25" aria-pressed="true">Focus 25</button>
    <button type="button" data-min="5" aria-pressed="false">Break 5</button>
    <button type="button" data-min="15" aria-pressed="false">Long 15</button>
  </div>
  <div class="ring">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="45"/><circle class="bar" id="bar" cx="50" cy="50" r="45"/></svg>
    <div class="time" id="time" role="timer" aria-live="off">25:00</div>
  </div>
  <div class="actions">
    <button type="button" id="toggle">Start</button>
    <button type="button" id="reset">Reset</button>
  </div>
</main>
<script>
(function () {
  var C = 2 * Math.PI * 45, bar = document.getElementById('bar'), timeEl = document.getElementById('time');
  var toggle = document.getElementById('toggle'), reset = document.getElementById('reset');
  var modes = document.querySelectorAll('.modes button');
  var total = 25 * 60, left = total, timer = null, endAt = 0;
  bar.style.strokeDasharray = C;
  function render() {
    var m = Math.floor(left / 60), s = left % 60;
    timeEl.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    bar.style.strokeDashoffset = C * (1 - left / total);
    document.title = (timer ? timeEl.textContent + ' · ' : '') + 'Pomodoro timer';
  }
  function chime() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 660; g.gain.setValueAtTime(0.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 1.2);
    } catch (e) {}
  }
  function stop() { clearInterval(timer); timer = null; toggle.textContent = 'Start'; }
  function tick() {
    left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    render();
    if (left === 0) { stop(); chime(); toggle.textContent = 'Again'; }
  }
  toggle.addEventListener('click', function () {
    if (timer) { stop(); return; }
    if (left === 0) left = total;
    endAt = Date.now() + left * 1000;
    timer = setInterval(tick, 250);
    toggle.textContent = 'Pause';
    render();
  });
  reset.addEventListener('click', function () { stop(); left = total; render(); });
  modes.forEach(function (b) {
    b.addEventListener('click', function () {
      modes.forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true');
      stop(); total = left = parseInt(b.dataset.min, 10) * 60; render();
    });
  });
  render();
})();
</script>
</body>
</html>
