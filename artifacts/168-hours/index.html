<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>168 Hours</title>
<script type="application/json" id="shelf-meta">
{
  "title": "168 Hours",
  "description": "Your week is 168 squares. Paint each hour with what it's for, set weekly targets, and see exactly how much time is unclaimed.",
  "created": "2026-11-04",
  "tool": "Claude",
  "kind": "app",
  "thumbnail": "thumbnail.png",
  "tags": ["planning", "time", "visual"],
  "why": "A weekly plan is easier to be honest about when you can see every hour of it at once.",
  "storage": "local",
  "notes": "Click or drag to paint. With the keyboard: arrow keys move, Space paints, 1-9 pick a brush, 0 erases, Ctrl/Cmd+Z undoes. Plans stay in this browser only."
}
</script>
<style>
  :root { color-scheme: light dark; --bg:#f5f6f3; --card:#fff; --ink:#1a1d1c; --muted:#5f6663; --line:#d9dcd8; --cell:#e8eae6; --accent:#0f766e; --field:#fafbf9; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111413; --card:#1a1e1c; --ink:#ecefed; --muted:#9aa29e; --line:#2c322f; --cell:#262c29; --accent:#2dd4bf; --field:#141816; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; padding:16px 14px 48px; }
  h1 { margin:0; font-size:1.5rem; letter-spacing:-.01em; } .lead { margin:2px 0 14px; color:var(--muted); }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 330px; gap:16px; align-items:start; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .totals { display:flex; flex-wrap:wrap; gap:6px 18px; margin-bottom:10px; font-variant-numeric:tabular-nums; }
  .totals b { font-size:1.15rem; } .totals span { color:var(--muted); font-size:.85rem; }
  .gridwrap { display:grid; grid-template-columns:34px 1fr; gap:4px 6px; }
  .days { grid-column:2; display:grid; grid-template-columns:repeat(7,1fr); gap:3px; font-size:.75rem; color:var(--muted); text-align:center; font-weight:600; }
  .hours { display:grid; grid-template-rows:repeat(24,1fr); gap:3px; font-size:.68rem; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .hours span { display:flex; align-items:center; justify-content:flex-end; }
  #grid { display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(24,minmax(17px,1fr)); grid-auto-flow:column; gap:3px; touch-action:none; user-select:none; -webkit-user-select:none; }
  .c { border-radius:5px; background:var(--cell); min-height:17px; aspect-ratio:auto; border:2px solid transparent; cursor:crosshair; padding:0; }
  .c.now { border-color:var(--ink); }
  .c:focus-visible { outline:3px solid var(--accent); outline-offset:1px; z-index:2; position:relative; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .brushes { display:grid; gap:6px; margin:0; padding:0; list-style:none; }
  .brush { display:grid; grid-template-columns:auto 1fr 64px; gap:8px; align-items:center; padding:6px 8px; border:2px solid transparent; border-radius:12px; background:var(--field); }
  .brush.on { border-color:var(--ink); }
  .brush input[type=radio] { appearance:none; width:26px; height:26px; border-radius:8px; background:var(--c); border:2px solid rgba(0,0,0,.18); margin:0; cursor:pointer; }
  .brush input[type=radio]:checked { box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--ink); }
  .brush .nm { min-width:0; border:0; background:transparent; font:inherit; font-weight:600; color:inherit; padding:2px 4px; border-radius:6px; width:100%; }
  .brush .nm:hover { background:rgba(128,128,128,.12); }
  .brush .tg { width:100%; border:1px solid var(--line); border-radius:8px; background:var(--card); color:inherit; font:inherit; padding:4px 6px; text-align:right; }
  .meter { grid-column:1 / -1; height:7px; border-radius:99px; background:var(--cell); overflow:hidden; position:relative; }
  .meter i { display:block; height:100%; background:var(--c); border-radius:99px; }
  .meter u { position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); }
  .stat { grid-column:1 / -1; display:flex; justify-content:space-between; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .stat .over { color:#c2410c; } .stat .ok { color:var(--accent); }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .b { min-height:38px; padding:0 12px; border:1px solid var(--line); background:var(--card); color:inherit; border-radius:10px; font:inherit; font-size:.88rem; cursor:pointer; }
  .b:hover { border-color:var(--accent); } .b:disabled { opacity:.45; cursor:default; }
  h2 { margin:0 0 8px; font-size:.85rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  .msg { min-height:1.3em; margin:8px 0 0; font-size:.85rem; color:var(--accent); }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>168 Hours</h1>
  <p class="lead">One week, one square per hour. Pick a brush, then click or drag across the grid.</p>
  <div class="layout">
    <section class="card" aria-label="Week grid">
      <div class="totals" aria-live="polite"><div><b id="tPlanned">0</b> <span>hours planned</span></div><div><b id="tFree">168</b> <span>hours unclaimed</span></div></div>
      <div class="gridwrap">
        <div class="days" id="days" aria-hidden="true"></div>
        <div class="hours" id="hours" aria-hidden="true"></div>
        <div id="grid" role="grid" aria-label="Hours of the week, Monday to Sunday" aria-describedby="help"></div>
      </div>
      <p class="sr" id="help">Arrow keys move between hours. Space or Enter paints the selected brush. Numbers 1 to 9 select a brush, 0 selects the eraser.</p>
      <div class="row">
        <button class="b" id="undo" type="button">Undo</button>
        <button class="b" id="redo" type="button">Redo</button>
        <button class="b" id="sleep" type="button">Fill sleep 23:00–07:00</button>
        <button class="b" id="clear" type="button">Clear week</button>
      </div>
    </section>
    <aside class="card" aria-label="Brushes and targets">
      <h2>Brushes <span style="text-transform:none;letter-spacing:0">· hours per week · target</span></h2>
      <ul class="brushes" id="brushes" role="radiogroup" aria-label="Brush"></ul>
      <div class="row">
        <button class="b" id="addCat" type="button">Add brush</button>
        <button class="b" id="copy" type="button">Copy summary</button>
      </div>
      <p class="msg" id="msg" role="status"></p>
    </aside>
  </div>
</div>
<script>
(function () {
  var KEY = '168-hours:v1', DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var PALETTE = ['#6366f1', '#0ea5e9', '#f59e0b', '#10b981', '#ec4899', '#94a3b8', '#ef4444', '#8b5cf6', '#14b8a6', '#eab308'];
  var $ = function (id) { return document.getElementById(id); };
  var state = { cats: [
    { name: 'Sleep', color: PALETTE[0], target: 56 }, { name: 'Work', color: PALETTE[1], target: 40 }, { name: 'Learning', color: PALETTE[2], target: 5 },
    { name: 'Movement', color: PALETTE[3], target: 4 }, { name: 'People', color: PALETTE[4], target: '' }, { name: 'Chores', color: PALETTE[5], target: '' } ],
    cells: [] };
  for (var i = 0; i < 168; i++) state.cells.push(-1);
  var brush = 0, undoStack = [], redoStack = [], cursor = 0, painting = false, stroke = null;
  function idx(day, hour) { return day * 24 + hour; }           // cells are stored day by day: Monday 00:00 is index 0

  /* ---------- persistence ---------- */
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && Array.isArray(s.cats) && Array.isArray(s.cells) && s.cells.length === 168 && s.cats.length <= 10) {
        state.cats = s.cats.map(function (c, i) { return { name: String(c.name || 'Brush').slice(0, 24), color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : PALETTE[i % 10], target: c.target === '' || c.target == null ? '' : Math.max(0, Math.min(168, +c.target || 0)) }; });
        state.cells = s.cells.map(function (v) { return Number.isInteger(v) && v >= -1 && v < state.cats.length ? v : -1; });
      }
    } catch (e) {}
  }

  /* ---------- grid ---------- */
  var grid = $('grid'), cellEls = [];
  function build() {
    $('days').replaceChildren(); $('hours').replaceChildren(); grid.replaceChildren(); cellEls = [];
    DAYS.forEach(function (d) { var s = document.createElement('span'); s.textContent = d; $('days').append(s); });
    for (var h = 0; h < 24; h++) { var s = document.createElement('span'); s.textContent = h % 3 === 0 ? String(h).padStart(2, '0') : ''; $('hours').append(s); }
    var now = new Date(), nowIdx = idx((now.getDay() + 6) % 7, now.getHours());
    for (var d = 0; d < 7; d++) for (var hh = 0; hh < 24; hh++) {
      var i = idx(d, hh), b = document.createElement('button');
      b.type = 'button'; b.className = 'c' + (i === nowIdx ? ' now' : ''); b.dataset.i = i; b.tabIndex = i === cursor ? 0 : -1; b.setAttribute('role', 'gridcell');
      cellEls[i] = b; grid.append(b);
    }
  }
  function label(i) { var c = state.cells[i]; return DAYS[Math.floor(i / 24)] + ' ' + String(i % 24).padStart(2, '0') + ':00, ' + (c < 0 ? 'unclaimed' : state.cats[c].name); }
  function paintCell(i) {
    var c = state.cells[i], el = cellEls[i];
    el.style.background = c < 0 ? '' : state.cats[c].color; el.setAttribute('aria-label', label(i));
  }
  function paintAll() { for (var i = 0; i < 168; i++) paintCell(i); summary(); }
  function counts() { var n = state.cats.map(function () { return 0; }); state.cells.forEach(function (c) { if (c >= 0) n[c]++; }); return n; }

  /* ---------- brushes ---------- */
  function renderBrushes() {
    var ul = $('brushes'); ul.replaceChildren();
    var n = counts();
    var all = state.cats.concat([{ name: 'Eraser', color: 'transparent', eraser: true }]);
    all.forEach(function (c, i) {
      var bi = c.eraser ? -1 : i, li = document.createElement('li'); li.className = 'brush' + (brush === bi ? ' on' : ''); li.style.setProperty('--c', c.color === 'transparent' ? 'var(--cell)' : c.color);
      var r = document.createElement('input'); r.type = 'radio'; r.name = 'brush'; r.checked = brush === bi; r.setAttribute('aria-label', c.name + (c.eraser ? '' : ', ' + n[i] + ' hours')); r.addEventListener('change', function () { brush = bi; renderBrushes(); });
      li.append(r);
      if (c.eraser) { var t = document.createElement('span'); t.textContent = 'Eraser (0)'; t.style.cssText = 'font-weight:600;padding:2px 4px'; li.append(t); li.append(document.createElement('span')); ul.append(li); return; }
      var nm = document.createElement('input'); nm.className = 'nm'; nm.value = c.name; nm.maxLength = 24; nm.setAttribute('aria-label', 'Name of brush ' + (i + 1));
      nm.addEventListener('input', function () { c.name = nm.value || 'Brush'; save(); paintAll(); });
      var tg = document.createElement('input'); tg.className = 'tg'; tg.type = 'number'; tg.min = 0; tg.max = 168; tg.value = c.target; tg.placeholder = 'goal'; tg.setAttribute('aria-label', 'Weekly target in hours for ' + c.name);
      tg.addEventListener('input', function () { c.target = tg.value === '' ? '' : Math.max(0, Math.min(168, +tg.value || 0)); save(); renderBrushes(); });
      li.append(nm, tg);
      var st = document.createElement('div'); st.className = 'stat';
      var left = document.createElement('span'); left.textContent = n[i] + ' h'; var right = document.createElement('span');
      if (c.target !== '') { var diff = n[i] - c.target; right.textContent = diff === 0 ? 'on target' : (diff > 0 ? '+' + diff + ' h over' : (-diff) + ' h to go'); right.className = diff === 0 ? 'ok' : diff > 0 ? 'over' : ''; }
      st.append(left, right);
      var scale = Math.max(c.target === '' ? 56 : c.target, n[i], 1);       // the bar's full width: the larger of target, hours used, or a 56 h default
      var m = document.createElement('div'); m.className = 'meter'; var f = document.createElement('i'); f.style.width = (n[i] / scale * 100) + '%'; m.append(f);
      if (c.target !== '') { var u = document.createElement('u'); u.style.left = (c.target / scale * 100) + '%'; m.append(u); }
      li.append(st, m); ul.append(li);
    });
    $('addCat').disabled = state.cats.length >= 9;
  }
  function summary() {
    var used = state.cells.filter(function (c) { return c >= 0; }).length;
    $('tPlanned').textContent = used; $('tFree').textContent = 168 - used; renderBrushes();
    $('undo').disabled = !undoStack.length; $('redo').disabled = !redoStack.length;
  }

  /* ---------- painting (pointer + keyboard), with undo per stroke ---------- */
  function setCell(i, v) { if (state.cells[i] === v) return; stroke.changes.push([i, state.cells[i], v]); state.cells[i] = v; paintCell(i); }
  function begin() { stroke = { changes: [] }; }
  function end() { if (stroke && stroke.changes.length) { undoStack.push(stroke); if (undoStack.length > 60) undoStack.shift(); redoStack = []; save(); } stroke = null; summary(); }
  function cellAt(x, y) { var e = document.elementFromPoint(x, y); return e && e.classList && e.classList.contains('c') ? +e.dataset.i : -1; }
  grid.addEventListener('pointerdown', function (e) {
    var i = cellAt(e.clientX, e.clientY); if (i < 0) return; e.preventDefault(); painting = true; begin(); focusCell(i);
    var v = state.cells[i] === brush && brush >= 0 ? -1 : brush;   // clicking a cell that already has this brush clears it
    stroke.value = v; setCell(i, v); try { grid.setPointerCapture(e.pointerId); } catch (x) {}
  });
  grid.addEventListener('pointermove', function (e) { if (!painting) return; var i = cellAt(e.clientX, e.clientY); if (i >= 0) { setCell(i, stroke.value); } });
  function stop() { if (painting) { painting = false; end(); } }
  grid.addEventListener('pointerup', stop); grid.addEventListener('pointercancel', stop);
  function focusCell(i) { cellEls[cursor].tabIndex = -1; cursor = i; cellEls[i].tabIndex = 0; cellEls[i].focus(); }
  grid.addEventListener('keydown', function (e) {
    var d = 0, i = cursor;
    if (e.key === 'ArrowDown') d = 1; else if (e.key === 'ArrowUp') d = -1; else if (e.key === 'ArrowRight') d = 24; else if (e.key === 'ArrowLeft') d = -24;
    if (d) { e.preventDefault(); var n = i + d; if (n >= 0 && n < 168) { if (e.shiftKey && painting === false) { begin(); setCell(n, brush); end(); } focusCell(n); } return; }
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); begin(); setCell(i, state.cells[i] === brush && brush >= 0 ? -1 : brush); end(); }
  });
  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName; if (tag === 'INPUT' && e.target.type !== 'radio' || tag === 'TEXTAREA') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); (e.shiftKey ? redo : undo)(); return; }
    if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) { var n = +e.key; if (n === 0) brush = -1; else if (n <= state.cats.length) brush = n - 1; else return; renderBrushes(); }
  });
  function apply(ch, forward) { ch.changes.forEach(function (c) { state.cells[c[0]] = forward ? c[2] : c[1]; paintCell(c[0]); }); }
  function undo() { var s = undoStack.pop(); if (!s) return; apply(s, false); redoStack.push(s); save(); summary(); }
  function redo() { var s = redoStack.pop(); if (!s) return; apply(s, true); undoStack.push(s); save(); summary(); }
  $('undo').addEventListener('click', undo); $('redo').addEventListener('click', redo);
  $('sleep').addEventListener('click', function () {
    var s = state.cats.findIndex(function (c) { return /sleep/i.test(c.name); }); if (s < 0) s = 0;
    begin(); for (var d = 0; d < 7; d++) for (var h = 0; h < 24; h++) if (h >= 23 || h < 7) setCell(idx(d, h), s); end(); say('Filled 23:00–07:00 every day with “' + state.cats[s].name + '”.');
  });
  $('clear').addEventListener('click', function () { if (!state.cells.some(function (c) { return c >= 0; })) return; begin(); for (var i = 0; i < 168; i++) setCell(i, -1); end(); say('Week cleared. Undo brings it back.'); });
  $('addCat').addEventListener('click', function () { if (state.cats.length >= 9) return; state.cats.push({ name: 'New brush', color: PALETTE[state.cats.length % 10], target: '' }); brush = state.cats.length - 1; save(); renderBrushes(); });
  function say(t) { $('msg').textContent = t; }
  $('copy').addEventListener('click', function () {
    var n = counts(), used = state.cells.filter(function (c) { return c >= 0; }).length;
    var lines = ['My 168 hours', ''].concat(state.cats.map(function (c, i) { return c.name + ': ' + n[i] + ' h' + (c.target !== '' ? ' (goal ' + c.target + ')' : ''); }), ['Unclaimed: ' + (168 - used) + ' h']);
    var text = lines.join('\n');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { say('Summary copied.'); }, function () { window.prompt('Copy this', text); });
  });

  load(); build(); paintAll();
})();
</script>
</body>
</html>
